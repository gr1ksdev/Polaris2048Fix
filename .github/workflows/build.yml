name: Build Polaris2048Fix
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - name: Build Intel macOS app
        run: |
          xcodebuild \
            -project Polaris2048Fix.xcodeproj \
            -scheme Polaris2048Fix \
            -configuration Release \
            -destination 'platform=macOS,arch=x86_64' \
            -derivedDataPath Build \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package app
        run: |
          ditto -c -k --keepParent \
            Build/Build/Products/Release/Polaris2048Fix.app \
            Polaris2048Fix-v0.3-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Polaris2048Fix-v0.3-x86_64
          path: Polaris2048Fix-v0.3-x86_64.zip
